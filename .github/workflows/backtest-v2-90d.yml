name: Free 90-day 21-pair FX strategy v2 research

on:
  workflow_dispatch:
  push:
    branches: [strategy-v2-research-filters]
    paths:
      - 'eurjpy_sniper/backtest_v2.py'
      - 'scripts/backtest_21_pairs_v2.py'
      - 'tests/test_backtest_v2.py'
      - '.github/workflows/backtest-v2-90d.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Set historical window
        id: dates
        run: |
          echo "from=$(date -u -d '90 days ago' +%F)" >> "$GITHUB_OUTPUT"
          echo "to=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download free Dukascopy 1-minute candles
        env:
          START_DATE: ${{ steps.dates.outputs.from }}
          END_DATE: ${{ steps.dates.outputs.to }}
        run: |
          set -e
          mkdir -p data/backtest download
          symbols="eurjpy cadjpy gbpjpy gbpaud chfjpy eurchf usdjpy gbpusd usdchf usdcad gbpcad audchf gbpchf euraud audcad eurcad audjpy eurusd cadchf eurgbp audusd"
          for symbol in $symbols; do
            echo "Downloading $symbol"
            if npx --yes dukascopy-node@latest -i "$symbol" -from "$START_DATE" -to "$END_DATE" -t m1 -f csv; then
              file=$(find download -type f -iname "${symbol}-m1-bid-*.csv" -print -quit || true)
              if [ -n "$file" ]; then cp "$file" "data/backtest/${symbol^^}.csv"; else echo "WARNING: missing CSV for $symbol"; fi
            else echo "WARNING: failed download for $symbol"; fi
          done
          ls -lh data/backtest
      - name: Run v2 research backtest
        run: python scripts/backtest_21_pairs_v2.py --data-dir data/backtest --output-dir backtest_v2_output --days 90 --cost-pips 2.0
      - uses: actions/upload-artifact@v4
        with:
          name: fx-21-pair-v2-90-day-research
          path: backtest_v2_output/
          if-no-files-found: error
          retention-days: 30
