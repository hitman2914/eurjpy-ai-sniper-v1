name: Deploy EURJPY Sniper PWA
on:
  push:
    branches: [main]
    paths: ['sniper-app/**', '.github/workflows/deploy-pwa.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Download EURJPY historical CSV into site
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://cdn.jsdelivr.net/gh/getdata-finance/eurjpy-5m-ohlcv-forex-historical-data@main/EURJPY_5m.csv' -o sniper-app/EURJPY_5m.csv
          test "$(wc -c < sniper-app/EURJPY_5m.csv)" -gt 100000\n          head -n 1 sniper-app/EURJPY_5m.csv | grep -qi 'open.*high.*low.*close'\n      - name: Validate dashboard JavaScript\n        run: node --check sniper-app/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sniper-app
      - id: deployment
        uses: actions/deploy-pages@v4
